[project]
name = "lumen-requirements-intelligence"
version = "1.0.0"
description = "LÜMEN — AI-Powered Requirements Quality & Compliance Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6", "httpx>=0.27", "python-dotenv>=1.0", "pymupdf>=1.24", "python-docx>=1.1",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1", "reportlab>=4.0", "pytesseract>=0.3.10", "pillow>=10",
]

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
